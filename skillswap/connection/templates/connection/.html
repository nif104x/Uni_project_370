        {% for con in convo %} 
            
            {% if con.0 != user1 %}
            <div class="message incoming">
                <div class="bubble">{{ con.1 }}</div>
                <span class="timestamp">{{ con.2|date:"g:i A" }}</span>
            </div>
            {% endif %} 

            {% if con.0 == user1 %}
            <div class="message outgoing">
                <div class="bubble">{{ con.1 }}</div>
                <span class="timestamp">{{ con.2|date:"g:i A" }}</span>
            </div>
            {% endif %} 

        {% endfor %}
